    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #F9F8F3;
            color: #0D1B2A;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Cuadrícula técnica milimétrica y de puntos */
        .canvas-grid-dots {
            background-color: #F9F8F3;
            background-image:
                radial-gradient(rgba(20, 103, 121, 0.22) 1.25px, transparent 1.25px),
                radial-gradient(rgba(204, 202, 181, 0.35) 1px, transparent 1px);
            background-size: var(--grid-size, 24px) var(--grid-size, 24px), calc(var(--grid-size, 24px) * 5) calc(var(--grid-size, 24px) * 5);
            background-position: 0 0, 0 0;
        }

        .canvas-grid-lines {
            background-color: #F9F8F3;
            background-size: var(--grid-size, 24px) var(--grid-size, 24px), calc(var(--grid-size, 24px) * 5) calc(var(--grid-size, 24px) * 5);
            background-image:
                linear-gradient(to right, rgba(20, 103, 121, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(20, 103, 121, 0.06) 1px, transparent 1px),
                linear-gradient(to right, rgba(20, 103, 121, 0.16) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(20, 103, 121, 0.16) 1px, transparent 1px);
        }

        .canvas-clean {
            background-color: #F9F8F3;
        }

        /* Animaciones de pulso y filtrado vivo profesional */
        @keyframes subtleGlowTeal {
            0%, 100% { box-shadow: 0 0 0 0 rgba(20, 103, 121, 0.4), 0 4px 12px rgba(13, 27, 42, 0.08); }
            50% { box-shadow: 0 0 0 6px rgba(20, 103, 121, 0.15), 0 8px 18px rgba(20, 103, 121, 0.2); }
        }

        .item-selected-glow {
            outline: 2.5px solid #146779 !important;
            box-shadow: 0 0 0 4px rgba(20, 103, 121, 0.18), 0 10px 25px -5px rgba(13, 27, 42, 0.15) !important;
        }
        @keyframes pulseGlowPink {
            0%, 100% { box-shadow: 0 0 0 0 rgba(247, 50, 130, 0.55), 0 15px 30px -5px rgba(13, 27, 42, 0.15); }
            50% { box-shadow: 0 0 0 10px rgba(247, 50, 130, 0), 0 20px 35px -5px rgba(247, 50, 130, 0.28); }
        }

        .ingredient-match-glow {
            animation: subtleGlowTeal 2.2s infinite ease-in-out;
            outline: 2.5px solid #146779 !important;
        }

        /* Estilo de barras personalizadas de rango */
        input[type="range"].lumino-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].lumino-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0D1B2A;
            border: 3px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: grab;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type="range"].lumino-slider::-webkit-slider-thumb:hover {
            transform: scale(1.18);
            background: #F73282;
        }

        /* Scrollbars sutiles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(13, 27, 42, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(20, 103, 121, 0.5);
        }

        /* Ocultar controles durante la exportación */
        .exporting-mode .no-export {
            display: none !important;
        }
        .exporting-mode .canvas-item-wrapper {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

            const svgRef = useRef(null);

            // Eje X: Net Carbs (0 a 20g) -> 40 a 330 px

            const mapX = (netCarbs) => 45 + (netCarbs / 20) * 285;
            const mapY = (protein) => 225 - ((protein - 10) / 13) * 190;

            const handleSvgClickOrDrag = (e) => {
                if (!svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const carbVal = Math.max(3, Math.min(20, Math.round(((clickX - 45) / 285) * 20)));
                const protVal = Math.max(10, Math.min(21, Math.round(10 + ((225 - clickY) / 190) * 13)));

                setFilters(prev => ({
                    ...prev,
                    maxNetCarbs: carbVal,
                    minProtein: protVal
                }));
            };

            const zoneRightX = mapX(filters.maxNetCarbs);
            const zoneBottomY = mapY(filters.minProtein);

className="w-full h-full bg-white rounded-2xl border border-slate-200 shadow-xl p-4 flex flex-col justify-between">

                            className="w-full h-full cursor-crosshair select-none"
                            onMouseDown={(e) => { setDraggingZone(true); handleSvgClickOrDrag(e); }}
                            onMouseMove={(e) => { if (draggingZone) handleSvgClickOrDrag(e); }}
                            onMouseUp={() => setDraggingZone(false)}
                            onMouseLeave={() => setDraggingZone(false)}

                            {/* Cuadrícula de Fondo */}
                            <rect x="45" y="25" width="285" height="200" fill="#F8FAFC" rx="6" stroke="#E2E8F0" />

                            <rect
                                x="45"
                                y="25"
                                width={Math.max(10, zoneRightX - 45)}
                                height={Math.max(10, zoneBottomY - 25)}
                                fill="rgba(20, 103, 121, 0.13)"
                                stroke="#146779"
                                strokeWidth="2"
                                strokeDasharray="5 3"
                            />
                            <text x={Math.max(55, zoneRightX - 8)} y={Math.max(40, zoneBottomY - 6)} fill="#146779" fontFamily="Montserrat" fontWeight="800" fontSize="8.5" textAnchor="end">
                                ZONA FILTRO ACTIVA (≥{filters.minProtein}g Pro | ≤{filters.maxNetCarbs}g NetCarb)
                            </text>

                            {/* Líneas Guía */}
                            {[5, 10, 15, 20].map(c => (
                                <g key={c}>
                                    <line x1={mapX(c)} y1="25" x2={mapX(c)} y2="225" stroke="#E2E8F0" strokeDasharray="2 2" />
                                    <text x={mapX(c)} y="240" fontSize="8.5" fill="#64748B" textAnchor="middle" fontFamily="Roboto">{c}g</text>
                                </g>
                            ))}
                            {[12, 16, 20].map(p => (

                                    <line x1="45" y1={mapY(p)} x2="330" y2={mapY(p)} stroke="#E2E8F0" strokeDasharray="2 2" />

                                PROTEÍNA (g) →

                            {/* Burbujas de las 5 Barras */}
                            {bars.map(b => {

                                            textAnchor="middle"
                                            fontFamily="Montserrat"
                                        >
                                            {b.name.split(' ')[0]}
                                        </text>
                                    </g>
                                );
                            })}

                                            <div

        // ============================================================================
        // 6.5. WIDGET DE GRÁFICO DINÁMICO MULTI-VARIABLE (BARRAS, RADAR, DONUT, SCATTER, RANKING)

        const NUTRITIONAL_METRICS = {
            protein: { label: 'Proteína', unit: 'g', max: 25, color: '#146779' },
            netCarbs: { label: 'Carbohidratos Netos', unit: 'g', max: 25, color: '#F73282' },
            polyols: { label: 'Polioles / Edulcorante', unit: 'g', max: 20, color: '#9333EA' },
            fiber: { label: 'Fibra Prebiótica', unit: 'g', max: 15, color: '#10B981' },
            satFat: { label: 'Grasa Saturada', unit: 'g', max: 8, color: '#BE123C' },
            totalFat: { label: 'Grasa Total', unit: 'g', max: 12, color: '#D97706' },
            calories: { label: 'Calorías Totales', unit: 'kcal', max: 250, color: '#0D1B2A' },
            sodium: { label: 'Sodio', unit: 'mg', max: 250, color: '#F59E0B' },

            item, 
            bars, 
            selectedBarId, 
            onSelectBar

            const config = item.config || {};
            const chartType = config.chartType || 'bar';
            const metricKey = config.metric || 'protein';
            const secondaryMetricKey = config.secondaryMetric || 'netCarbs';
            const primaryColor = config.primaryColor || '#146779';
            const accentColor = config.accentColor || '#38BDF8';
            const showLabels = config.showLabels !== false;
            const showGrid = config.showGrid !== false;
            const title = config.title || `Análisis: ${NUTRITIONAL_METRICS[metricKey]?.label || 'Proteína'}`;

            const metricDef = NUTRITIONAL_METRICS[metricKey] || NUTRITIONAL_METRICS.protein;
            const activeBar = bars.find(b => b.id === selectedBarId) || bars[0];

                                    const barH = Math.min(130, Math.max(6, (val / metricDef.max) * 125));

                        {chartType === 'donut' && (() => {

                            const total = proKcal + fatKcal + carbKcal;
                            
                            const proPct = (proKcal / total);
                            const fatPct = (fatKcal / total);
                            const carbPct = (carbKcal / total);

                            const r = 50;

                                    </svg>
                                    <div className="space-y-1.5 text-[9.5px] font-roboto">

        // ============================================================================
        // 6.5. DASHBOARD DEDICADO DE PRODUCTO (CAPA DE ENFOQUE PROFUNDO / FOCUS LAYER)

        const FocusedBarDashboard = ({ barId, allBars, onClose, customImage, onUploadImage }) => {

            const avgProtein = +(allBars.reduce((acc, b) => acc + b.protein, 0) / allBars.length).toFixed(1);

            const center = 110;
            const radius = 75;

            const getPoint = (axisIdx, value, max, invert) => {
                const angle = (Math.PI * 2 * axisIdx) / axes.length - Math.PI / 2;
                const norm = invert ? Math.max(0.1, 1 - value / max) : Math.min(1, value / max);
                const r = norm * radius;

            return (
                <div 
className="w-full h-full bg-white rounded-2xl border border-slate-200 shadow-xl p-4 flex flex-col justify-between">

        // ============================================================================

        const App = () => {

            const [snapToGrid, setSnapToGrid] = useState(true);
            const [zoom, setZoom] = useState(0.92);
            const [presentationMode, setPresentationMode] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [exportNotice, setExportNotice] = useState(null);

            // Imágenes personalizadas subidas por el usuario para cualquier barra
            const [customBarImages, setCustomBarImages] = useState({});

            // Estado de los Filtros Gráficos Vivos
            const [filters, setFilters] = useState({
                minProtein: 10,
                maxNetCarbs: 20,
                maxPolyols: 16,
                minFiber: 0,
                maxSatFat: 6,
                hideUnmatched: false
            });

            // Filtro por Ingrediente / Sticker Lindo seleccionado
            const [activeStickerTag, setActiveStickerTag] = useState(null);
            const [highlightedBarId, setHighlightedBarId] = useState(null);
            const [selectedBarId, setSelectedBarId] = useState(null);
            const [showInspector, setShowInspector] = useState(true);

            const updateSelectedItemProps = (newProps) => {
                if (!selectedUid) return;
                setItems(prev => prev.map(item => {
                    if (item.uid !== selectedUid) return item;
                    return {
                        ...item,
                        ...newProps,
                        config: {
                            ...(item.config || {}),
                            ...(newProps.config || {})
                        }
                    };
                }));
            };

            // Referencias para Drag & Resize en el Canvas
            const canvasRef = useRef(null);
            const dragState = useRef(null);

            const resetFilters = () => {
                setFilters({
                    minProtein: 10,
                    maxNetCarbs: 20,
                    maxPolyols: 16,
                    minFiber: 0,
                    maxSatFat: 6,
                    hideUnmatched: false
                });
                setActiveStickerTag(null);
                setHighlightedBarId(null);
                setSelectedBarId(null);
            };

            // Evaluación de qué barras cumplen los filtros gráficos vivos
            const checkBarMatches = useCallback((bar) => {
                return (
                    bar.protein >= filters.minProtein &&
                    bar.netCarbs <= filters.maxNetCarbs &&
                    bar.polyols <= filters.maxPolyols &&
                    bar.fiber >= filters.minFiber &&
                    bar.satFat <= filters.maxSatFat
                );
            }, [filters]);

            const matchingBarsCount = useMemo(() => {
                return PROTEIN_BARS_DATA.filter(checkBarMatches).length;
            }, [checkBarMatches]);

            const currentSelectedBar = useMemo(() => {
                return PROTEIN_BARS_DATA.find(b => b.id === (selectedBarId || highlightedBarId)) || null;
            }, [selectedBarId, highlightedBarId]);

            const selectedBarTags = useMemo(() => {
                return currentSelectedBar ? currentSelectedBar.tags : [];
            }, [currentSelectedBar]);

            const applicableTags = useMemo(() => {
                const matched = PROTEIN_BARS_DATA.filter(checkBarMatches);
                return new Set(matched.flatMap(b => b.tags));
            }, [checkBarMatches]);

            const autoLayoutMap = useMemo(() => {
                if (!filters.hideUnmatched) return null;
                const map = {};
                let bIdx = 0;
                PROTEIN_BARS_DATA.forEach(bar => {
                    if (checkBarMatches(bar)) {
                        const col = bIdx % 3;
                        const row = Math.floor(bIdx / 3);
                        map[`bar_${bar.id}`] = {
                            x: 455 + col * 330,
                            y: 132 + row * 385,
                            hidden: false
                        };
                        bIdx++;
                    } else {
                        map[`bar_${bar.id}`] = { hidden: true };
                    }
                });

                const lipidCol = bIdx % 3;
                const lipidRow = Math.floor(bIdx / 3);
                map['widget_lipids_polyols'] = {
                    x: 455 + lipidCol * 330,
                    y: 132 + lipidRow * 385
                };

                let stIdx = 0;
                items.filter(it => it.type === 'cute_sticker').forEach(it => {
                    const st = CUTE_STICKERS_LIBRARY.find(s => s.id === it.stickerId);
                    const isApplicable = st && (applicableTags.has(st.tag) || (currentSelectedBar && currentSelectedBar.tags.includes(st.tag)));
                    if (isApplicable) {
                        map[it.uid] = {
                            x: 755 + stIdx * 128,
                            y: 24,
                            hidden: false
                        };
                        stIdx++;
                    } else {
                        map[it.uid] = { hidden: true };
                    }
                });

                return map;
            }, [filters.hideUnmatched, checkBarMatches, items, applicableTags, currentSelectedBar]);

            // Iniciar Arrastre o Redimensionamiento de un elemento del lienzo
            const startInteraction = (e, uid, mode = 'move') => {
                e.stopPropagation();
                const targetItem = items.find(i => i.uid === uid);
                if (!targetItem) return;

                // Traer al frente al seleccionar
                const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                setSelectedUid(uid);
                setItems(prev => prev.map(it => it.uid === uid ? { ...it, z: maxZ + 1 } : it));

                dragState.current = {
                    uid,
                    mode, // 'move' o 'resize'
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: targetItem.x,
                    origY: targetItem.y,
                    origW: targetItem.w,
                    origH: targetItem.h
                };
            };

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!dragState.current) return;
                    const { uid, mode, startX, startY, origX, origY, origW, origH } = dragState.current;
                    const dx = (e.clientX - startX) / zoom;
                    const dy = (e.clientY - startY) / zoom;

                    setItems(prev => prev.map(item => {
                        if (item.uid !== uid) return item;
                        if (mode === 'move') {
                            let nx = origX + dx;
                            let ny = origY + dy;
                            if (snapToGrid) {
                                const step = Math.max(8, Math.round(gridSize / 2));
                                nx = Math.round(nx / step) * step;
                                ny = Math.round(ny / step) * step;
                            }
                            return { ...item, x: Math.max(8, nx), y: Math.max(8, ny) };
                        } else {
                            let nw = Math.max(95, origW + dx);
                            let nh = Math.max(70, origH + dy);
                            if (snapToGrid) {
                                const step = Math.max(8, Math.round(gridSize / 2));
                                nw = Math.round(nw / step) * step;
                                nh = Math.round(nh / step) * step;
                            }
                            return { ...item, w: nw, h: nh };
                        }
                    }));
                };

                const handleMouseUp = () => {
                    dragState.current = null;
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [zoom, snapToGrid, gridSize]);

            const spawnSticker = (stickerObj, customX = null, customY = null) => {

                setActiveStickerTag(stickerObj.tag);

            const spawnBarCard = (barId) => {
                const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                const newUid = `card_${barId}_${Date.now()}`;
                setItems(prev => [
                    ...prev,
                    {
                        uid: newUid,
                        type: 'bar_card',
                        barId,
                        x: 460 + Math.round(Math.random() * 140),
                        y: 160 + Math.round(Math.random() * 140),
                        w: 310,
                        h: 365,
                        z: maxZ + 1
                    }

                setSelectedUid(newUid);
            };

            const spawnWidget = (widgetType, w = 380, h = 360, customX = null, customY = null) => {
                const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                const newUid = `widget_${widgetType}_${Date.now()}`;
                setItems(prev => [
                    ...prev,
                    {
                        uid: newUid,
                        type: widgetType,

                        y: customY ?? (190 + Math.round(Math.random() * 120)),

                                                <h4 className="font-montserrat font-black text-xs uppercase tracking-wider text-lumino-teal">
                                                    Gráficas-Filtro Interactivas
                                                </h4>
                                                <p className="text-[11px] text-slate-500 leading-snug mt-0.5">
                                                    Inserta widgets analíticos vivos que filtran las barras directamente desde el lienzo.
                                                </p>
                                            </div>

                                            <div
                                                draggable onDragStart={(e) => handleSidebarDragStart(e, { kind: 'widget', widgetType: 'macro_sculptor' })}
                                                className="p-3.5 rounded-2xl bg-lumino-bg border border-slate-200 hover:border-lumino-pink cursor-pointer transition space-y-1"
                                            >
                                                <div 
className="font-montserrat font-black text-xs text-lumino-dark">🎛️ Escultor de Macros y Polioles</div>
                                                <p className="text-[10.5px] text-slate-500">Sliders táctiles de Proteína, Carbos Netos, Fibra, Grasa Saturada y Alcoholes de Azúcar.</p>
                                            </div>

                                            <div
                                                draggable onDragStart={(e) => handleSidebarDragStart(e, { kind: 'widget', widgetType: 'scatter_matrix' })}
                                                className="p-3.5 rounded-2xl bg-lumino-bg border border-slate-200 hover:border-lumino-teal cursor-pointer transition space-y-1"
                                            >
                                                <div 
className="font-montserrat font-black text-xs text-lumino-dark">🎯 Matriz 2D con Zona Meta</div>
                                                <p className="text-[10.5px] text-slate-500">Gráfica de burbujas donde arrastras el cuadrante objetivo para filtrar las barras.</p>
                                            </div>

                                            <div
                                                draggable onDragStart={(e) => handleSidebarDragStart(e, { kind: 'widget', widgetType: 'lipid_polyol_chart' })}
                                                className="p-3.5 rounded-2xl bg-lumino-bg border border-slate-200 hover:border-lumino-burgundy cursor-pointer transition space-y-1"
                                            >
                                                <div 
className="font-montserrat font-black text-xs text-lumino-dark">🔬 Radiografía Química y Trazas</div>
                                                <p className="text-[10.5px] text-slate-500">Compara Fibra vs. Polioles, Grasas Saturadas/Trans y matriz de alérgenos en planta.</p>
                                            </div>

                                            <div
                                                draggable onDragStart={(e) => handleSidebarDragStart(e, { kind: 'widget', widgetType: 'radar_chart' })}
                                                className="p-3.5 rounded-2xl bg-lumino-bg border border-slate-200 hover:border-lumino-olive cursor-pointer transition space-y-1"
                                            >
                                                <div 
className="font-montserrat font-black text-xs text-lumino-dark">🕸️ Radar Nutricional 360°</div>
                                                <p className="text-[10.5px] text-slate-500">Polígono multivariable con Proteína, Fibra, Potasio, Calcio y Eficiencia Keto.</p>
                                            </div>

                                            <div
                                                draggable
                                                onDragStart={(e) => handleSidebarDragStart(e, { kind: 'widget', widgetType: 'custom_chart' })}
                                                className="p-3.5 rounded-2xl bg-teal-50/60 border-2 border-dashed border-lumino-teal hover:bg-teal-100/50 cursor-grab active:cursor-grabbing transition space-y-1 shadow-sm"
                                            >
                                                <div className="font-montserrat font-black text-xs text-lumino-teal flex items-center justify-between">
                                                    <span>📈 Gráfico Configurable BI</span>
                                                    <span className="text-[9px] bg-lumino-teal text-white px-2 py-0.5 rounded-full uppercase">Nuevo</span>
                                                </div>
                                                <p className="text-[10.5px] text-slate-600">Gráfico flexible: cambia a Barras, Ranking, Donut, Radar o Dispersión y elige la variable en el Inspector.</p>
                                                <div className="text-[8.5px] font-bold text-lumino-teal uppercase pt-1">✥ Arrastra al lienzo para agregar</div>
                                            </div>
                                        </div>
                                    )}

                                    {/* PESTAÑA 4: SELLOS, ALERTAS Y TEXTOS EDITABLES */}
                                    {activeSidebarTab === 'annotations' && (
                                        <div 
className="space-y-3">
                                            <div>
                                                <h4 className="font-montserrat font-black text-xs uppercase tracking-wider text-lumino-teal">
                                                    Sellos Científicos y Notas
                                                </h4>
                                                <p className="text-[11px] text-slate-500 leading-snug mt-0.5">
                                                    Haz clic para añadir bloques de texto editables (doble clic para escribir tu propio análisis).
                                                </p>
                                            </div>

                                            {[
                                                {
                                                    title: '🏆 GANADOR EN FIBRA PREBIÓTICA',
                                                    text: 'Quest Bar aporta 12g de fibra de maíz soluble con solo 4g de Carbos Netos.',
                                                    color: '#146779'
                                                },
                                                {
                                                    title: '⚠️ ALERTA DE EFECTO LAXANTE',
                                                    text: 'Barebells y Grenade contienen Maltitol. Grenade alcanza 16g de polioles por barra.',
                                                    color: '#780030'
                                                },
                                                {
                                                    title: '🥚 ETIQUETA LIMPIA (WHOLE FOODS)',
                                                    text: 'RXBAR usa solo dátiles, claras de huevo, almendras, anacardos y cacao 100%.',
                                                    color: '#786F14'
                                                },
                                                {
                                                    title: '📝 NOTA PERSONALIZADA DE CLIENTE',
                                                    text: 'Haz clic sobre este texto en el lienzo para escribir tus propias conclusiones...',
                                                    color: '#0D1B2A'
                                                }
                                            ].map((preset, idx) => (
                                                <div
                                                    key={idx}
                                                    draggable onDragStart={(e) => handleSidebarDragStart(e, { kind: 'callout', preset })}
                                                    className="p-3 rounded-2xl bg-lumino-bg border border-slate-200 hover:border-lumino-pink cursor-pointer transition"
                                                >
                                                    <div 
className="font-montserrat font-extrabold text-[11px]" style={{ color: preset.color }}>
                                                        {preset.title}
                                                    </div>
                                                    <p className="text-[10px] text-slate-600 mt-1">{preset.text}</p>
                                                    <div className="text-[8.5px] font-bold text-slate-400 uppercase mt-1">✥ Arrastra al lienzo para agregar</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Barra Inferior del Inspector (Acciones sobre el elemento seleccionado) */}
                                <div 
className="p-3 bg-slate-100 border-t border-slate-200 flex items-center justify-between">
                                    <div 
className="text-[10px] font-montserrat font-bold text-slate-500 truncate">
                                        {selectedUid ? `Seleccionado: ${selectedUid.split('_')[0].toUpperCase()}` : 'Ningún elemento seleccionado'}
                                    </div>
                                    <div 
className="flex items-center gap-1.5">
                                        <button
                                            onClick={duplicateSelectedItem}
                                            disabled={!selectedUid}
                                            className="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-[10px] font-bold text-lumino-dark disabled:opacity-40 hover:bg-lumino-teal hover:text-white transition"
                                        >
                                            Duplicar
                                        </button>
                                        <button
                                            onClick={deleteSelectedItem}
                                            disabled={!selectedUid}
                                            className="px-2.5 py-1 rounded-lg bg-rose-600 text-[10px] font-bold text-white disabled:opacity-40 hover:bg-rose-700 transition"
                                        >
                                            Eliminar
                                        </button>
                                    </div>
                                </div>
                            </aside>
                        )}

                        {/* ==================================================================== */}
                        {/* ÁREA DEL LIENZO INTERACTIVO (FREEFORM DRAG & DROP WORKSPACE)          */}
                        {/* ==================================================================== */}
                        <main 
                            className="flex-1 overflow-auto relative"
                            onMouseDown={() => setSelectedUid(null)}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={handleCanvasDrop}
                        >
                            {/* VISTA 1: DASHBOARD DEDICADO DE PRODUCTO (LAYER FOCUS) */}
                            {focusedBarId ? (
                                <FocusedBarDashboard
                                    barId={focusedBarId}
                                    allBars={PROTEIN_BARS_DATA}
                                    onClose={(newBarId) => {
                                        if (typeof newBarId === 'string') {
                                            setFocusedBarId(newBarId);
                                        } else {
                                            setFocusedBarId(null);
                                        }
                                    }}
                                    customImage={customBarImages[focusedBarId]}
                                    onUploadImage={(bId, imgData) => setCustomBarImages(prev => ({ ...prev, [bId]: imgData }))}
                                />
                            ) : (
                            /* VISTA 2: LIENZO GLOBAL DE TRABAJO */
                            <div
                                ref={canvasRef}
                                className={`min-w-[1600px] min-h-[1080px] relative transition-colors duration-300 origin-top-left ${gridStyle === 'dots' ? 'canvas-grid-dots' : gridStyle === 'lines' ? 'canvas-grid-lines' : 'canvas-clean'}`}
                                style={{
                                    transform: `scale(${zoom})`,
                                    height: '1080px',
                                    '--grid-size': `${gridSize}px`
                                }}
                            >
                                {/* PANTALLA DE INICIO / ONBOARDING CUANDO EL LIENZO ESTÁ VACÍO */}
                                {items.length === 0 && (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto z-10 p-8 select-none">
                                        <div className="max-w-xl w-full bg-white/95 backdrop-blur-md rounded-3xl p-8 border-2 border-dashed border-slate-300 shadow-2xl text-center flex flex-col items-center animate-fadeIn">
                                            <div className="w-16 h-16 rounded-2xl bg-teal-50 border border-teal-200 flex items-center justify-center text-3xl shadow-sm mb-4">
                                                🎨
                                            </div>
                                            <h2 className="font-montserrat font-black text-2xl text-lumino-dark tracking-tight">
                                                Lienzo de Análisis Vacío
                                            </h2>
                                            <p className="text-sm text-slate-500 font-sans mt-2 leading-relaxed">
                                                Comienza tu investigación nutricional desde cero arrastrando elementos, o inicializa una plantilla prediseñada.
                                            </p>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full mt-6">
                                                <button
                                                    onClick={() => applyLayoutPreset('random')}
                                                    className="w-full px-4 py-3 rounded-2xl bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-600 hover:to-indigo-700 text-white font-montserrat font-bold text-xs uppercase tracking-wider shadow-lg flex items-center justify-center gap-2 transition hover:scale-[1.02]"
                                                >
                                                    <span>🎲</span> Generar Tema Aleatorio
                                                </button>
                                                <button
                                                    onClick={() => applyLayoutPreset('default')}
                                                    className="w-full px-4 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-montserrat font-bold text-xs uppercase tracking-wider shadow-md flex items-center justify-center gap-2 transition hover:scale-[1.02]"
                                                >
                                                    <span>📊</span> Cargar Benchmark BI
                                                </button>
                                            </div>

                                            <div className="mt-5 text-[11px] text-slate-400 flex items-center gap-2">
                                                <span>💡</span>
                                                <span>Arrastra tarjetas, stickers o gráficos desde el panel izquierdo para crear tu diseño</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                {/* Marca de Agua Institucional en el Lienzo */}
                                <div 
className="absolute bottom-4 right-6 pointer-events-none flex items-center gap-2 opacity-50">
                                    <div 
className="w-4 h-4 rounded-full bg-lumino-dark" />
                                    <span className="font-montserrat font-black text-xs tracking-widest text-lumino-dark">
                                        LUMINOBITE STUDIO • DYNAMIC NUTRITION CANVAS
                                    </span>
                                </div>

                                {/* RENDERIZADO DE CADA ELEMENTO EN EL LIENZO */}
                                {items.map(item => {
                                    const isSelected = selectedUid === item.uid && !presentationMode;

                                    // Si es una tarjeta de barra y el usuario activó "Ocultar descartadas"
                                    let posX = item.x;
                                    let posY = item.y;
                                    if (autoLayoutMap) {
                                        if (item.type === 'bar_card') {
                                            const lInfo = autoLayoutMap[`bar_${item.barId}`];
                                            if (!lInfo || lInfo.hidden) return null;
                                            posX = lInfo.x;
                                            posY = lInfo.y;
                                        } else if (item.type === 'lipid_polyol_chart' && autoLayoutMap['widget_lipids_polyols']) {
                                            posX = autoLayoutMap['widget_lipids_polyols'].x;
                                            posY = autoLayoutMap['widget_lipids_polyols'].y;
                                        } else if (item.type === 'cute_sticker') {
                                            const sInfo = autoLayoutMap[item.uid];
                                            if (!sInfo || sInfo.hidden) return null;
                                            posX = sInfo.x;
                                            posY = sInfo.y;
                                        }
                                    } else if (item.type === 'bar_card') {
                                        const barObj = PROTEIN_BARS_DATA.find(b => b.id === item.barId);
                                        if (barObj && filters.hideUnmatched && !checkBarMatches(barObj)) {
                                            return null;
                                        }
                                    }

                                    return (
                                        <div
                                            key={item.uid}
                                            onMouseDown={(e) => startInteraction(e, item.uid, 'move')}
                                            style={{
                                                position: 'absolute',
                                                left: `${posX}px`,
                                                top: `${posY}px`,
                                                transition: filters.hideUnmatched ? 'left 0.35s ease, top 0.35s ease' : 'none',
                                                width: `${item.w}px`,
                                                height: `${item.h}px`,
                                                zIndex: item.z || 1
                                            }}
                                            className={`canvas-item-wrapper group cursor-move transition-shadow ${
                                                isSelected ? 'ring-2 ring-lumino-pink ring-offset-2 rounded-2xl' : ''
                                            }`}
                                        >
                                            {/* Barra Flotante de Controles cuando está seleccionado */}
                                            {isSelected && (
                                                <div 

                                                    className="no-export absolute -top-8 left-0 bg-lumino-dark text-white px-2.5 py-1 rounded-lg shadow-lg flex items-center gap-2 text-[10px] font-montserrat font-bold z-50"
                                                    onMouseDown={(e) => e.stopPropagation()}
                                                >
                                                    <span className="text-lumino-beige">✥ Arrastrar</span>
                                                    <button onClick={duplicateSelectedItem} className="hover:text-lumino-teal">⧉ Clonar</button>
                                                    <button onClick={deleteSelectedItem} className="hover:text-lumino-pink">✕ Borrar</button>
                                                </div>
                                            )}

                                            {/* 1. BANNER DE TÍTULO EDITABLE */}
                                            {item.type === 'title_banner' && (
                                                <div 
style={{ backgroundColor: item.bgColor || '#0D1B2A', borderLeftColor: item.accentColor || '#F73282' }} className="w-full h-full text-white rounded-2xl px-6 py-3.5 shadow-xl border-l-8 flex flex-col justify-center">
                                                    <div 

                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="font-montserrat font-black text-xl md:text-2xl tracking-tight text-white outline-none cursor-text"
                                                    >
                                                        {item.title}
                                                    </div>
                                                    <div 

                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="text-xs text-lumino-beige font-sans mt-1 outline-none cursor-text"
                                                    >
                                                        {item.subtitle}
                                                    </div>
                                                </div>
                                            )}

                                            {/* 2. TARJETA DE BARRA DE PROTEÍNA */}
                                            {item.type === 'bar_card' && (() => {
                                                const bar = PROTEIN_BARS_DATA.find(b => b.id === item.barId) || PROTEIN_BARS_DATA[0];
                                                const matched = checkBarMatches(bar);
                                                const pulsed = (activeStickerTag && bar.tags.includes(activeStickerTag));
                                                const isSelectedBar = selectedBarId === bar.id || highlightedBarId === bar.id;
                                                return (
                                                    <BarProductCard
                                                        bar={bar}
                                                        isMatchedByFilter={matched}
                                                        isPulsedBySticker={pulsed}
                                                        activeStickerTag={activeStickerTag}
                                                        isSelectedBar={isSelectedBar}
                                                        onFocusBar={(bId) => setFocusedBarId(bId)}
                                                        onSelectBar={(bId) => {
                                                            setSelectedBarId(prev => prev === bId ? null : bId);
                                                            setHighlightedBarId(prev => prev === bId ? null : bId);
                                                        }}
                                                        customImage={customBarImages[bar.id]}
                                                        onUploadImage={(bId, imgData) => setCustomBarImages(prev => ({ ...prev, [bId]: imgData }))}
                                                        config={item.config}
                                                    />
                                                );
                                            })()}

                                            {/* 3. WIDGET ESCULTOR DE MACROS */}
                                            {item.type === 'macro_sculptor' && (
                                                <MacroSculptorWidget
                                                    filters={filters}
                                                    setFilters={setFilters}
                                                    resetFilters={resetFilters}
                                                    matchingCount={matchingBarsCount}
                                                    totalCount={PROTEIN_BARS_DATA.length}
                                                />
                                            )}

                                            {/* 4. WIDGET MATRIZ 2D SCATTER */}
                                            {item.type === 'scatter_matrix' && (
                                                <ScatterMatrixWidget
                                                    bars={PROTEIN_BARS_DATA}
                                                    filters={filters}
                                                    setFilters={setFilters}
                                                    activeStickerTag={activeStickerTag}
                                                />
                                            )}

                                            {/* 5. WIDGET RADIOGRAFÍA DE CARBOS / POLIOLES / GRASAS / ALÉRGENOS */}
                                            {item.type === 'lipid_polyol_chart' && (
                                                <LipidPolyolWidget
                                                    bars={PROTEIN_BARS_DATA}
                                                    highlightedBarId={highlightedBarId}
                                                    onSelectHighlightBar={setHighlightedBarId}
                                                />
                                            )}

                                            {item.type === 'custom_chart' && (
                                                <FlexibleBiChartWidget
                                                    item={item}
                                                    bars={PROTEIN_BARS_DATA}
                                                    selectedBarId={selectedBarId}
                                                    onSelectBar={(bId) => {
                                                        setSelectedBarId(prev => prev === bId ? null : bId);
                                                        setHighlightedBarId(prev => prev === bId ? null : bId);
                                                    }}
                                                />
                                            )}
                                            {item.type === 'radar_chart' && (
                                                <RadarComparisonWidget bars={PROTEIN_BARS_DATA} />
                                            )}

                                            {/* 7. STICKER LINDO DE INGREDIENTE (CON FILTRO PULSANTE AL HACER CLIC) */}
                                            {item.type === 'cute_sticker' && (() => {
                                                const cfg = item.config || {};
                                                const st = CUTE_STICKERS_LIBRARY.find(s => s.id === item.stickerId) || CUTE_STICKERS_LIBRARY[0];
                                                const iconType = cfg.iconType || st.iconType || 'milk';
                                                const primaryColor = cfg.primaryColor || st.primaryColor || '#146779';
                                                const secondaryColor = cfg.secondaryColor || st.secondaryColor || '#38BDF8';
                                                const bg = cfg.bg || st.bg || '#F8FAFC';
                                                const border = cfg.border || st.border || '#CBD5E1';
                                                const textColor = cfg.textColor || '#0D1B2A';
                                                const label = cfg.label ?? st.label;
                                                const sub = cfg.sub ?? st.sub;
                                                const isFilteringThis = activeStickerTag === st.tag;
                                                const isPresentInSelectedBar = selectedBarTags.includes(st.tag);
                                                return (
                                                    <div
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setActiveStickerTag(prev => prev === st.tag ? null : st.tag);
                                                      }}
                                                        style={{ backgroundColor: isPresentInSelectedBar ? '#F0FDFA' : bg, borderColor: isPresentInSelectedBar ? '#146779' : isFilteringThis ? '#F73282' : border }}
                                                        className={`w-full h-full rounded-2xl border-2 p-2 shadow-sm flex flex-col items-center justify-center text-center transition-all duration-300 hover:scale-105 ${isPresentInSelectedBar ? 'ring-4 ring-lumino-teal/40 shadow-lg scale-105' : ''} ${
                                                            isFilteringThis ? 'ring-4 ring-lumino-pink/40' : ''
                                                        }`}
                                                        title="Haz clic para resaltar las barras que contienen este ingrediente"
                                                    >
                                                        <div 
className="w-12 h-12 shrink-0">
                                                            <ScientificIcon iconType={iconType} primaryColor={primaryColor} secondaryColor={secondaryColor} />
                                                        </div>
                                                        <div 
className="font-montserrat font-black text-[10px] text-lumino-dark leading-tight mt-1">
                                                            <span style={{ color: textColor }}>{label}</span>
                                                        </div>
                                                        <div 
className="text-[8.5px] font-bold text-lumino-teal uppercase">
                                                            {isPresentInSelectedBar ? `✓ EN ${currentSelectedBar?.name?.split(' ')[0]}` : isFilteringThis ? '● FILTRO ACTIVO' : sub}
                                                        </div>
                                                    </div>
                                                );
                                            })()}

                                            {/* 8. SELLO / NOTA CIENTÍFICA EDITABLE */}
                                            {item.type === 'callout_badge' && (
                                                <div 

                                                    className="w-full h-full rounded-2xl p-3.5 text-white shadow-lg flex flex-col justify-center"
                                                    style={{ backgroundColor: item.badgeColor || '#780030' }}
                                                >
                                                    <div
                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="font-montserrat font-black text-xs uppercase tracking-wider outline-none cursor-text"
                                                    >
                                                        {item.title}
                                                    </div>
                                                    <div
                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="text-[11px] text-white/90 leading-snug mt-1 outline-none cursor-text"
                                                    >
                                                        {item.text}
                                                    </div>
                                                </div>
                                            )}

                                            {/* ESQUINA DE REDIMENSIONAMIENTO (RESIZE HANDLE) */}
                                            {!presentationMode && (
                                                <div
                                                    onMouseDown={(e) => startInteraction(e, item.uid, 'resize')}
                                                    title="Arrastra para redimensionar"
                                                    className="no-export absolute bottom-1 right-1 w-5 h-5 rounded-md bg-white/90 border border-slate-300 shadow flex items-center justify-center cursor-nwse-resize opacity-0 group-hover:opacity-100 transition"
                                                >
                                                    <svg width="10" height="10" viewBox="0 0 10 10" className="text-lumino-dark">
                                                        <path d="M9 1L1 9M9 5L5 9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
                                                    </svg>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            )}
                        </main>

                        {/* BARRA LATERAL DERECHA: INSPECTOR DE PROPIEDADES Y COLORES */}
                        {showInspector && !presentationMode && !focusedBarId && (
                            <PropertyInspectorSidebar
                                selectedItem={items.find(i => i.uid === selectedUid)}
                                onUpdateProps={updateSelectedItemProps}
                                onClose={() => setShowInspector(false)}
                                allBars={PROTEIN_BARS_DATA}
                                allIcons={CUTE_STICKERS_LIBRARY}
                                onDelete={deleteSelectedItem}
                                onDuplicate={duplicateSelectedItem}
                                onFocusBar={(bId) => setFocusedBarId(bId)}
                            />
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
