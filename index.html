    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #F9F8F3;
            color: #0D1B2A;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Cuadrícula técnica milimétrica y de puntos */
        .canvas-grid-dots {
            background-color: #F9F8F3;
            background-image: 
                radial-gradient(rgba(20, 103, 121, 0.22) 1.25px, transparent 1.25px),
                radial-gradient(rgba(204, 202, 181, 0.35) 1px, transparent 1px);
            background-size: 24px 24px, 120px 120px;
            background-position: 0 0, 0 0;
        }

        .canvas-grid-lines {
            background-color: #F9F8F3;
            background-size: 20px 20px, 100px 100px;
            background-image:
                linear-gradient(to right, rgba(20, 103, 121, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(20, 103, 121, 0.06) 1px, transparent 1px),
                linear-gradient(to right, rgba(20, 103, 121, 0.16) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(20, 103, 121, 0.16) 1px, transparent 1px);
        }

        .canvas-clean {
            background-color: #F9F8F3;
        }

        /* Animaciones de pulso y filtrado vivo */
        @keyframes pulseGlowPink {
            0%, 100% { box-shadow: 0 0 0 0 rgba(247, 50, 130, 0.55), 0 15px 30px -5px rgba(13, 27, 42, 0.15); }
            50% { box-shadow: 0 0 0 10px rgba(247, 50, 130, 0), 0 20px 35px -5px rgba(247, 50, 130, 0.28); }
        }

        .ingredient-match-glow {
            animation: pulseGlowPink 2s infinite;
            outline: 3px solid #F73282 !important;
        }

        /* Estilo de barras personalizadas de rango */
        input[type="range"].lumino-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].lumino-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0D1B2A;
            border: 3px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: grab;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type="range"].lumino-slider::-webkit-slider-thumb:hover {
            transform: scale(1.18);
            background: #F73282;
        }

        /* Scrollbars sutiles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(13, 27, 42, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(20, 103, 121, 0.5);
        }

        /* Ocultar controles durante la exportación */
        .exporting-mode .no-export {
            display: none !important;
        }
        .exporting-mode .canvas-item-wrapper {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

        // ============================================================================
        // 6. WIDGETS DE GRÁFICAS-FILTRO VIVAS (ZERO TRADITIONAL EXCEL FILTERS)

        // WIDGET 1: Escultor Visual de Macronutrientes (Barras Interactivas Directas)

                                <div className="flex justify-between text-[11px] font-bold mb-1">

        };

        // WIDGET 2: Matriz de Burbujas 2D con "Zona Objetivo" Arrastrable
        const ScatterMatrixWidget = ({ bars, filters, setFilters, activeStickerTag }) => {
            const svgRef = useRef(null);
            const [draggingZone, setDraggingZone] = useState(false);

            // Eje X: Net Carbs (0 a 20g) -> 40 a 330 px
            // Eje Y: Proteína (10 a 23g) -> 220 a 30 px
            const mapX = (netCarbs) => 45 + (netCarbs / 20) * 285;
            const mapY = (protein) => 225 - ((protein - 10) / 13) * 190;

            const handleSvgClickOrDrag = (e) => {
                if (!svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const carbVal = Math.max(3, Math.min(20, Math.round(((clickX - 45) / 285) * 20)));
                const protVal = Math.max(10, Math.min(21, Math.round(10 + ((225 - clickY) / 190) * 13)));

                setFilters(prev => ({
                    ...prev,
                    maxNetCarbs: carbVal,
                    minProtein: protVal
                }));
            };

            const zoneRightX = mapX(filters.maxNetCarbs);
            const zoneBottomY = mapY(filters.minProtein);

            return (
                <div className="w-full h-full bg-white rounded-2xl border border-slate-200 shadow-xl p-4 flex flex-col justify-between">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div>
                            <h3 className="font-montserrat font-black text-xs uppercase tracking-wider text-lumino-dark">

                        <span className="text-[10px] font-roboto font-bold px-2 py-0.5 rounded bg-teal-50 text-lumino-teal border border-teal-200">
                            Tamaño = Fibra
                        </span>
                    </div>

                    <div 
                        className="flex-1 flex items-center justify-center relative"
                        onMouseDown={(e) => e.stopPropagation()}
                    >
                        <svg 
                            ref={svgRef}
                            viewBox="0 0 355 255" 
                            className="w-full h-full cursor-crosshair select-none"
                            onMouseDown={(e) => { setDraggingZone(true); handleSvgClickOrDrag(e); }}
                            onMouseMove={(e) => { if (draggingZone) handleSvgClickOrDrag(e); }}
                            onMouseUp={() => setDraggingZone(false)}
                            onMouseLeave={() => setDraggingZone(false)}
                        >
                            {/* Cuadrícula de Fondo */}
                            <rect x="45" y="25" width="285" height="200" fill="#F8FAFC" rx="6" stroke="#E2E8F0" />
                            
                            {/* Zona Objetivo Activa (Target Zone Filter) */}
                            <rect
                                x="45"
                                y="25"
                                width={Math.max(10, zoneRightX - 45)}
                                height={Math.max(10, zoneBottomY - 25)}
                                fill="rgba(20, 103, 121, 0.13)"
                                stroke="#146779"
                                strokeWidth="2"
                                strokeDasharray="5 3"
                            />
                            <text x={Math.max(55, zoneRightX - 8)} y={Math.max(40, zoneBottomY - 6)} fill="#146779" fontFamily="Montserrat" fontWeight="800" fontSize="8.5" textAnchor="end">
                                ZONA FILTRO ACTIVA (≥{filters.minProtein}g Pro | ≤{filters.maxNetCarbs}g NetCarb)
                            </text>

                            {/* Líneas Guía */}
                            {[5, 10, 15, 20].map(c => (
                                <g key={c}>
                                    <line x1={mapX(c)} y1="25" x2={mapX(c)} y2="225" stroke="#E2E8F0" strokeDasharray="2 2" />
                                    <text x={mapX(c)} y="240" fontSize="8.5" fill="#64748B" textAnchor="middle" fontFamily="Roboto">{c}g</text>
                                </g>
                            ))}
                            {[12, 16, 20].map(p => (
                                <g key={p}>
                                    <line x1="45" y1={mapY(p)} x2="330" y2={mapY(p)} stroke="#E2E8F0" strokeDasharray="2 2" />
                                    <text x="38" y={mapY(p)+3} fontSize="8.5" fill="#64748B" textAnchor="end" fontFamily="Roboto">{p}g</text>
                                </g>
                            ))}

                            {/* Etiquetas de Ejes */}
                            <text x="190" y="252" fontSize="9" fontWeight="700" fill="#0D1B2A" textAnchor="middle" fontFamily="Montserrat">
                                CARBOHIDRATOS NETOS (g) →
                            </text>
                            <text x="12" y="125" fontSize="9" fontWeight="700" fill="#0D1B2A" textAnchor="middle" fontFamily="Montserrat" transform="rotate(-90 12 125)">
                                PROTEÍNA (g) →
                            </text>

                            {/* Burbujas de las 5 Barras */}
                            {bars.map(b => {
                                const cx = mapX(b.netCarbs);
                                const cy = mapY(b.protein);
                                const r = 9 + (b.fiber * 1.1);
                                const inZone = b.protein >= filters.minProtein && b.netCarbs <= filters.maxNetCarbs && b.polyols <= filters.maxPolyols && b.fiber >= filters.minFiber && b.satFat <= filters.maxSatFat;

                                return (
                                    <g key={b.id}>
                                        <circle
                                            cx={cx}
                                            cy={cy}
                                            r={r}
                                            fill={inZone ? b.brandColor : '#CBD5E1'}
                                            fillOpacity={inZone ? 0.88 : 0.45}
                                            stroke={isStickerMatch ? '#F73282' : '#FFFFFF'}
                                            strokeWidth={isStickerMatch ? 3.5 : 2}

                                        <text
                                            x={cx}
                                            y={cy - r - 4}
                                            fontSize="9"
                                            fontWeight="800"
                                            fill={inZone ? '#0D1B2A' : '#94A3B8'}
                                            textAnchor="middle"
                                            fontFamily="Montserrat"
                                        >
                                            {b.name.split(' ')[0]}
                                        </text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                </div>
            );
        };

        // WIDGET 3: Radiografía de Carbohidratos (Azúcar vs Fibra vs Polioles) y Perfil Lipídico/Sodio
        const LipidPolyolWidget = ({ bars, onSelectHighlightBar, highlightedBarId }) => {
            const [mode, setMode] = useState('carbs'); // 'carbs' | 'lipids' | 'allergens'

                                Trazas
                            </button>

                    <div className="flex-1 flex flex-col justify-around py-2" onMouseDown={(e) => e.stopPropagation()}>
                        {mode === 'carbs' && (
                            <div className="space-y-2.5">
                                <div className="flex items-center gap-3 text-[9.5px] font-bold justify-center">
                                    <span className="flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"/> Fibra</span>
                                    <span className="flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-purple-500 inline-block"/> Polioles</span>
                                    <span className="flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-lumino-pink inline-block"/> Azúcar/Almidón Neto</span>
                                </div>

        // WIDGET 4: Radar Comparador Multi-Barra (Añadible desde la barra lateral)
        const RadarComparisonWidget = ({ bars }) => {
            const axes = [
                { label: 'Proteína', key: 'protein', max: 22 },
                { label: 'Fibra', key: 'fiber', max: 12 },
                { label: 'Bajos NetCarbs', key: 'netCarbs', max: 20, invert: true },
                { label: 'Potasio', key: 'potassium', max: 450 },
                { label: 'Calcio', key: 'calcium', max: 180 }
            ];

            const center = 110;
            const radius = 75;

            const getPoint = (axisIdx, value, max, invert) => {
                const angle = (Math.PI * 2 * axisIdx) / axes.length - Math.PI / 2;
                const norm = invert ? Math.max(0.1, 1 - value / max) : Math.min(1, value / max);
                const r = norm * radius;
                return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
            };

            return (
                <div className="w-full h-full bg-white rounded-2xl border border-slate-200 shadow-xl p-4 flex flex-col justify-between">
                    <div className="border-b border-slate-100 pb-2 flex justify-between items-center">
                        <div>
                            <h3 className="font-montserrat font-black text-xs uppercase tracking-wider text-lumino-dark">
                                Radar Nutricional 360°
                            </h3>
                            <p className="text-[10px] text-slate-400">Comparativa de densidad nutricional</p>
                        </div>
                    </div>
                    <div className="flex-1 flex items-center justify-center">
                        <svg viewBox="0 0 220 220" className="w-48 h-48">
                            {[0.33, 0.66, 1].map((lvl, idx) => (
                                <polygon
                                    key={idx}
                                    points={axes.map((_, i) => {
                                        const angle = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
                                        return `${center + radius * lvl * Math.cos(angle)},${center + radius * lvl * Math.sin(angle)}`;
                                    }).join(' ')}
                                    fill="none"
                                    stroke="#E2E8F0"
                                    strokeWidth="1"
                                />
                            ))}
                            {axes.map((ax, i) => {
                                const angle = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
                                const x = center + (radius + 18) * Math.cos(angle);
                                const y = center + (radius + 18) * Math.sin(angle);
                                return (
                                    <text key={ax.label} x={x} y={y} fontSize="7.5" fontFamily="Montserrat" fontWeight="700" fill="#0D1B2A" textAnchor="middle">
                                        {ax.label}
                                    </text>
                                );
                            })}
                            {bars.slice(0, 3).map((b, idx) => (
                                <polygon
                                    key={b.id}
                                    points={axes.map((ax, i) => getPoint(i, b[ax.key], ax.max, ax.invert)).join(' ')}
                                    fill={ idx === 0 ? 'rgba(20,103,121,0.22)' : idx === 1 ? 'rgba(247,50,130,0.2)' : 'rgba(217,119,6,0.2)' }
                                    stroke={ idx === 0 ? '#146779' : idx === 1 ? '#F73282' : '#D97706' }
                                    strokeWidth="2"
                                />
                            ))}
                        </svg>
                    </div>
                    <div className="flex justify-center gap-3 text-[9px] font-bold">
                        <span className="text-lumino-teal">● Quest</span>
                        <span className="text-lumino-pink">● Barebells</span>
                        <span className="text-amber-600">● RXBAR</span>
                    </div>
                </div>
            );

        // ============================================================================
        // 7. APLICACIÓN PRINCIPAL: LUMINOBITE NUTRITION CANVAS STUDIO
        // ============================================================================
        const App = () => {
            const [items, setItems] = useState(createDefaultCanvasItems);
            const [selectedUid, setSelectedUid] = useState(null);
            const [activeSidebarTab, setActiveSidebarTab] = useState('stickers'); // 'stickers' | 'bars' | 'charts' | 'annotations'
            const [gridStyle, setGridStyle] = useState('dots'); // 'dots' | 'lines' | 'clean'
            const [snapToGrid, setSnapToGrid] = useState(true);
            const [zoom, setZoom] = useState(0.92);
            const [presentationMode, setPresentationMode] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [exportNotice, setExportNotice] = useState(null);

            // Imágenes personalizadas subidas por el usuario para cualquier barra
            const [customBarImages, setCustomBarImages] = useState({});

            // Estado de los Filtros Gráficos Vivos
            const [filters, setFilters] = useState({
                minProtein: 10,
                maxNetCarbs: 20,
                maxPolyols: 16,
                minFiber: 0,
                maxSatFat: 6,
                hideUnmatched: false
            });

            // Filtro por Ingrediente / Sticker Lindo seleccionado
            const [activeStickerTag, setActiveStickerTag] = useState(null);
            const [highlightedBarId, setHighlightedBarId] = useState(null);

            // Referencias para Drag & Resize en el Canvas
            const canvasRef = useRef(null);
            const dragState = useRef(null);

            const resetFilters = () => {
                setFilters({
                    minProtein: 10,
                    maxNetCarbs: 20,
                    maxPolyols: 16,
                    minFiber: 0,
                    maxSatFat: 6,
                    hideUnmatched: false
                });
                setActiveStickerTag(null);
                setHighlightedBarId(null);
            };

            // Evaluación de qué barras cumplen los filtros gráficos vivos
            const checkBarMatches = useCallback((bar) => {
                return (
                    bar.protein >= filters.minProtein &&
                    bar.netCarbs <= filters.maxNetCarbs &&
                    bar.polyols <= filters.maxPolyols &&
                    bar.fiber >= filters.minFiber &&
                    bar.satFat <= filters.maxSatFat
                );
            }, [filters]);

            const matchingBarsCount = useMemo(() => {
                return PROTEIN_BARS_DATA.filter(checkBarMatches).length;
            }, [checkBarMatches]);

            // Iniciar Arrastre o Redimensionamiento de un elemento del lienzo
            const startInteraction = (e, uid, mode = 'move') => {
                e.stopPropagation();
                const targetItem = items.find(i => i.uid === uid);
                if (!targetItem) return;

                // Traer al frente al seleccionar
                const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                setSelectedUid(uid);
                setItems(prev => prev.map(it => it.uid === uid ? { ...it, z: maxZ + 1 } : it));

                dragState.current = {
                    uid,
                    mode, // 'move' o 'resize'
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: targetItem.x,
                    origY: targetItem.y,
                    origW: targetItem.w,
                    origH: targetItem.h
                };
            };

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!dragState.current) return;
                    const { uid, mode, startX, startY, origX, origY, origW, origH } = dragState.current;
                    const dx = (e.clientX - startX) / zoom;
                    const dy = (e.clientY - startY) / zoom;

                    setItems(prev => prev.map(item => {
                        if (item.uid !== uid) return item;
                        if (mode === 'move') {
                            let nx = origX + dx;
                            let ny = origY + dy;
                            if (snapToGrid) {
                                nx = Math.round(nx / 12) * 12;
                                ny = Math.round(ny / 12) * 12;
                            }
                            return { ...item, x: Math.max(8, nx), y: Math.max(8, ny) };
                        } else {
                            let nw = Math.max(95, origW + dx);
                            let nh = Math.max(70, origH + dy);
                            if (snapToGrid) {
                                nw = Math.round(nw / 12) * 12;
                                nh = Math.round(nh / 12) * 12;
                            }
                            return { ...item, w: nw, h: nh };
                        }
                    }));
                };

                const handleMouseUp = () => {
                    dragState.current = null;
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [zoom, snapToGrid]);

            // Funciones para agregar nuevos elementos desde la Barra Lateral Izquierda (Canva Drawer)
            const spawnSticker = (stickerObj, customX = null, customY = null) => {
                const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                const newUid = `sticker_${stickerObj.id}_${Date.now()}`;
                setItems(prev => [
                    ...prev,
                    {
                        uid: newUid,
                        type: 'cute_sticker',
                        stickerId: stickerObj.id,
                        x: customX ?? (380 + Math.round(Math.random() * 240)),
                        y: customY ?? (180 + Math.round(Math.random() * 220)),
                        w: 120,
                        h: 105,
                        z: maxZ + 1

                setSelectedUid(newUid);
                setActiveStickerTag(stickerObj.tag);

            const spawnBarCard = (barId) => {

                    {

            const spawnWidget = (widgetType, w = 360, h = 340) => {

            // Plantillas de Auto-Acomodo Inteligente (Presets de Diseño)
            const applyLayoutPreset = (presetName) => {

                            x: 40,

                            z: 2,

                        ...CUTE_STICKERS_LIBRARY.slice(0, 6).map((st, idx) => ({
                            uid: `st_preset_${st.id}`,
                            type: 'cute_sticker',
                            stickerId: st.id,
                            x: 40 + idx * 135,

                            w: 122,
                            h: 104,
                            z: 15

                        ...PROTEIN_BARS_DATA.map((b, idx) => ({
                            uid: `card_preset_${b.id}`,
                            type: 'bar_card',
                            barId: b.id,
                            x: 40 + (idx % 3) * 330,
                            y: 250 + Math.floor(idx / 3) * 380,
                            w: 310,
                            h: 365,
                            z: 8
                        })),
                        {
                            uid: 'widget_allergen_table',
                            type: 'lipid_polyol_chart',
                            x: 1030,
                            y: 250,
                            w: 420,
                            h: 380,

                        {

            // Exportar Visualización a Imagen PNG de Alta Resolución
            const handleExportPNG = async () => {
                if (!canvasRef.current) return;
                setIsExporting(true);
                setSelectedUid(null);
                setExportNotice('Generando imagen PNG de alta resolución de tu lienzo...');

                setTimeout(async () => {
                    try {
                        const canvasEl = canvasRef.current;
                        const renderedCanvas = await window.html2canvas(canvasEl, {
                            backgroundColor: '#F9F8F3',
                            scale: 2,
                            useCORS: true,
                            logging: false
                        });
                        const dataUrl = renderedCanvas.toDataURL('image/png');
                        const link = document.createElement('a');

                        link.click();

                        setExportNotice('Error al exportar PNG. Intenta con la instantánea JSON/HTML.');

            // Exportar configuración interactiva JSON
            const handleExportJSON = () => {
                const payload = {
                    studio: 'LuminoBite Nutrition Canvas Studio',

                    filters,
                    items
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'LuminoBite_Dashboard_Layout.json';
                a.click();
                URL.revokeObjectURL(url);
                setExportNotice('¡Archivo de proyecto interactivo (.JSON) descargado!');
                setTimeout(() => setExportNotice(null), 3000);
            };

            // Soporte para arrastrar desde la barra lateral al lienzo
            const handleSidebarDragStart = (e, payload) => {
                e.dataTransfer.setData('application/luminobite', JSON.stringify(payload));
            };

            const handleCanvasDrop = (e) => {
                e.preventDefault();
                const raw = e.dataTransfer.getData('application/luminobite');
                if (!raw || !canvasRef.current) return;
                try {
                    const data = JSON.parse(raw);
                    const rect = canvasRef.current.getBoundingClientRect();
                    const dropX = Math.max(20, Math.round((e.clientX - rect.left) / zoom - 60));
                    const dropY = Math.max(20, Math.round((e.clientY - rect.top) / zoom - 50));

                    if (data.kind === 'sticker') {
                        const st = CUTE_STICKERS_LIBRARY.find(s => s.id === data.stickerId);
                        if (st) spawnSticker(st, dropX, dropY);
                    } else if (data.kind === 'bar') {
                        const maxZ = items.reduce((m, it) => Math.max(m, it.z || 1), 1);
                        setItems(prev => [...prev, {
                            uid: `card_${data.barId}_${Date.now()}`,

                            barId: data.barId,
                            x: dropX,
                            y: dropY,
                            w: 310,
                            h: 365,
                            z: maxZ + 1
                        }]);
                    } else if (data.kind === 'widget') {
                        spawnWidget(data.widgetType, 370, 350);
                    }
                } catch (err) {
                    console.error(err);
                }

                                            {item.type === 'scatter_matrix' && (
                                                <ScatterMatrixWidget
                                                    bars={PROTEIN_BARS_DATA}
                                                    filters={filters}
                                                    setFilters={setFilters}
                                                    activeStickerTag={activeStickerTag}
                                                />
                                            )}

                                            {/* 5. WIDGET RADIOGRAFÍA DE CARBOS / POLIOLES / GRASAS / ALÉRGENOS */}
                                            {item.type === 'lipid_polyol_chart' && (
                                                <LipidPolyolWidget
                                                    bars={PROTEIN_BARS_DATA}
                                                    highlightedBarId={highlightedBarId}
                                                    onSelectHighlightBar={setHighlightedBarId}
                                                />
                                            )}

                                            {/* 6. WIDGET RADAR NUTRICIONAL */}
                                            {item.type === 'radar_chart' && (
                                                <RadarComparisonWidget bars={PROTEIN_BARS_DATA} />
                                            )}

                                            {/* 7. STICKER LINDO DE INGREDIENTE (CON FILTRO PULSANTE AL HACER CLIC) */}
                                            {item.type === 'cute_sticker' && (() => {
                                                const st = CUTE_STICKERS_LIBRARY.find(s => s.id === item.stickerId) || CUTE_STICKERS_LIBRARY[0];
                                                const isFilteringThis = activeStickerTag === st.tag;
                                                return (
                                                    <div
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setActiveStickerTag(prev => prev === st.tag ? null : st.tag);
                                                        }}
                                                        style={{ backgroundColor: st.bg, borderColor: isFilteringThis ? '#F73282' : st.border }}
                                                        className={`w-full h-full rounded-2xl border-2 p-2 shadow-md flex flex-col items-center justify-center text-center transition-transform hover:scale-105 ${
                                                            isFilteringThis ? 'ring-4 ring-lumino-pink/40' : ''
                                                        }`}
                                                        title="Haz clic para resaltar las barras que contienen este ingrediente"
                                                    >
                                                        <div className="w-12 h-12 shrink-0">
                                                            {st.renderSvg()}
                                                        </div>
                                                        <div className="font-montserrat font-black text-[10px] text-lumino-dark leading-tight mt-1">
                                                            {st.label}
                                                        </div>
                                                        <div className="text-[8.5px] font-bold text-lumino-teal uppercase">
                                                            {isFilteringThis ? '● FILTRO ACTIVO' : st.sub}
                                                        </div>
                                                    </div>
                                                );
                                            })()}

                                            {/* 8. SELLO / NOTA CIENTÍFICA EDITABLE */}
                                            {item.type === 'callout_badge' && (
                                                <div 
                                                    className="w-full h-full rounded-2xl p-3.5 text-white shadow-lg flex flex-col justify-center"
                                                    style={{ backgroundColor: item.badgeColor || '#780030' }}
                                                >
                                                    <div
                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="font-montserrat font-black text-xs uppercase tracking-wider outline-none cursor-text"
                                                    >
                                                        {item.title}
                                                    </div>
                                                    <div
                                                        contentEditable
                                                        suppressContentEditableWarning
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        className="text-[11px] text-white/90 leading-snug mt-1 outline-none cursor-text"
                                                    >
                                                        {item.text}
                                                    </div>
                                                </div>
                                            )}

                                            {/* ESQUINA DE REDIMENSIONAMIENTO (RESIZE HANDLE) */}
                                            {!presentationMode && (
                                                <div
                                                    onMouseDown={(e) => startInteraction(e, item.uid, 'resize')}
                                                    title="Arrastra para redimensionar"
                                                    className="no-export absolute bottom-1 right-1 w-5 h-5 rounded-md bg-white/90 border border-slate-300 shadow flex items-center justify-center cursor-nwse-resize opacity-0 group-hover:opacity-100 transition"
                                                >
                                                    <svg width="10" height="10" viewBox="0 0 10 10" className="text-lumino-dark">
                                                        <path d="M9 1L1 9M9 5L5 9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
                                                    </svg>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
